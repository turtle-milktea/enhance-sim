<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>強化機率模擬</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single column instrument panel — controls on top, bar chart, then numeric table */
:root{
  --bg:#f5f6f9; --panel:#ffffff; --fg:#1b2030; --muted:#636a80; --line:#dde1ea;
  --bar:#4a63c9; --bar-lo:#a9b5e6; --goal:#d98a1c;
  --sans:"Noto Sans TC",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --panel:#1b1e29; --fg:#e7e9f1; --muted:#9298ad; --line:#2c3040;
  --bar:#7d93ee; --bar-lo:#3e4a7e; --goal:#f0a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --panel:#1b1e29; --fg:#e7e9f1; --muted:#9298ad; --line:#2c3040;
  --bar:#7d93ee; --bar-lo:#3e4a7e; --goal:#f0a640; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.45rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.controls{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label{font-size:.9rem;color:var(--muted)}
.n-big{font-family:var(--mono);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--bar)}
input[type=number],select{font:inherit;font-family:var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:7.5em}
select{width:auto;font-family:var(--sans)}
button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bar);outline-offset:2px}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:260px;border-bottom:1px solid var(--line);position:relative}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.val{font-family:var(--mono);font-size:.78rem;margin-bottom:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{width:100%;max-width:64px;background:var(--bar);border-radius:4px 4px 0 0;transition:height .12s ease-out;min-height:1px}
.col.goal .bar{background:var(--goal)}
.xl{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px;text-align:center;font-family:var(--mono);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted);line-height:1.6;margin:0}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}
@media (max-width:480px){.val{font-size:.62rem}.chart{gap:5px}.xl{gap:5px}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>強化機率分布模擬</h1>
    <p class="sub">每次強化成功率 10%；+1 以上失敗時，50% 下降一級、50% 不變。到達目標等級即停止（+5 為上限，到達後也停止）。拖動拉桿，查看強化 n 次後停在各等級的機率。</p>
  </header>

  <section class="panel controls">
    <div class="row" style="justify-content:space-between">
      <div><label>強化次數 n</label><div class="n-big" id="nShow">88</div></div>
      <div class="row">
        <label for="start">起始等級</label>
        <select id="start" autocomplete="off"><option value="0">+0</option><option value="1" selected>+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option></select>
        <label for="target">目標等級</label>
        <select id="target" autocomplete="off"><option value="0">+0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option><option value="5" selected>+5</option></select>
        <label for="maxN">拉桿上限</label>
        <select id="maxN" autocomplete="off"><option>200</option><option selected>1000</option><option>5000</option><option>20000</option></select>
      </div>
    </div>
    <input type="range" id="slider" autocomplete="off" min="0" max="1000" value="88" aria-label="強化次數">
    <div class="row">
      <button id="dec">−1</button><button id="inc">+1</button>
      <label for="nInput">直接輸入</label><input type="number" id="nInput" autocomplete="off" min="0" max="20000" value="88">
      <label for="scale">縱軸</label>
      <select id="scale" autocomplete="off"><option value="lin">線性</option><option value="log">對數</option></select>
    </div>
  </section>

  <section class="panel">
    <div class="chart" id="chart"></div>
    <div class="xl" id="xl"></div>
  </section>

  <section class="panel stats">
    <div class="stat"><div class="k" id="kHit"></div><div class="v" id="sHit"></div></div>
    <div class="stat"><div class="k" id="kNot"></div><div class="v" id="sNot"></div></div>
    <div class="stat"><div class="k" id="kE"></div><div class="v" id="sE"></div></div>
    <div class="stat"><div class="k">機率首次超過 50% 的 n</div><div class="v" id="sMed"></div></div>
  </section>

  <p class="note" id="note">對數縱軸以 10⁻⁶ 為下限，方便同時看清楚數量級差很多的機率。橘色長條為目標等級。</p>
</div>

<script>
// 基本轉移規則（不含停止條件）
const BASE=[[.9,.1,0,0,0,0],[.45,.45,.1,0,0,0],[0,.45,.45,.1,0,0],[0,0,.45,.45,.1,0],[0,0,0,.45,.45,.1],[0,0,0,0,0,1]];
const MAXN=20000;
const $=id=>document.getElementById(id);
let cache={}, cur={start:1,target:5,n:88};

// 目標等級 T 與 +5 皆為吸收態
function matrix(T){ return BASE.map((r,i)=> (i===T||i===5) ? r.map((_,j)=>+(j===i)) : r.slice()); }

// 解線性方程組（高斯消去，部分選主元）
function solve(A,b){
  const n=b.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; }
  }
  return M.map((r,i)=>r[n]/r[i]);
}

// 從 start 出發：最終到達 T 的機率 h、到達 T 必然時的期望次數 e
function analytic(start,T){
  if(start===T) return {h:1,e:0};
  const P=matrix(T), tr=[0,1,2,3,4,5].filter(i=>i!==T&&i!==5);
  const A=tr.map(i=>tr.map(j=>(i===j?1:0)-P[i][j]));
  const h=solve(A,tr.map(i=>P[i][T]));
  const hs=h[tr.indexOf(start)];
  if(Math.abs(hs-1)>1e-12) return {h:hs,e:null};
  const e=solve(A,tr.map(()=>1));
  return {h:1,e:e[tr.indexOf(start)]};
}

function table(start,T){
  const key=start+"-"+T; if(cache[key]) return cache[key];
  const P=matrix(T), out=new Float64Array((MAXN+1)*6);
  let v=[0,0,0,0,0,0]; v[start]=1;
  for(let n=0;n<=MAXN;n++){
    for(let j=0;j<6;j++) out[n*6+j]=v[j];
    const w=[0,0,0,0,0,0];
    for(let i=0;i<6;i++){ if(!v[i]) continue; for(let j=0;j<6;j++) w[j]+=v[i]*P[i][j]; }
    v=w;
  }
  let med=null; for(let n=0;n<=MAXN;n++){ if(out[n*6+T]>0.5){med=n;break;} }
  return cache[key]={out,med,...analytic(start,T)};
}

const chart=$("chart"), xl=$("xl"), cols=[];
for(let k=0;k<6;k++){
  const c=document.createElement("div"); c.className="col";
  c.innerHTML='<div class="val"></div><div class="bar"></div>'; chart.appendChild(c); cols.push(c);
  const l=document.createElement("div"); l.textContent="+"+k; xl.appendChild(l);
}
const pct=x=>(x*100).toFixed(4)+"%";

function render(){
  const T=cur.target, t=table(cur.start,T), n=cur.n, log=$("scale").value==="log";
  for(let k=0;k<6;k++){
    const p=t.out[n*6+k];
    let h = log ? (p<=1e-6?0:(Math.log10(p)+6)/6) : p;
    cols[k].classList.toggle("goal",k===T);
    cols[k].querySelector(".bar").style.height=(Math.max(0,h)*88)+"%";
    cols[k].querySelector(".val").textContent=pct(p);
    cols[k].querySelector(".bar").setAttribute("title","+"+k+"："+pct(p));
  }
  const hit=t.out[n*6+T];
  $("nShow").textContent=n;
  $("kHit").textContent="已到達 +"+T+"（n 次內）"; $("sHit").textContent=pct(hit);
  $("kNot").textContent="尚未到達 +"+T;        $("sNot").textContent=pct(1-hit);
  if(t.e!==null){ $("kE").textContent="期望總次數（自起點）"; $("sE").textContent=t.e.toFixed(3); }
  else { $("kE").textContent="最終能到達 +"+T+" 的機率"; $("sE").textContent=pct(t.h); }
  $("sMed").textContent = t.med!==null ? t.med : (t.h<=0.5 ? "不會超過 50%" : "> "+MAXN);
  $("note").textContent = (T<cur.start
      ? "目標低於起始等級：代表「掉到 +"+T+"」的機率。若途中先到達 +5 就會停止，因此最終機率可能小於 100%。"
      : T===cur.start ? "目標等於起始等級：第 0 次就已達成。" : "")
    + " 對數縱軸以 10⁻⁶ 為下限。橘色長條為目標等級。";
}
function setN(n){
  n=Math.max(0,Math.min(MAXN,Math.round(+n||0))); cur.n=n;
  if(n>+$("slider").max){ const opts=[200,1000,5000,20000]; const m=opts.find(o=>o>=n); $("maxN").value=m; $("slider").max=m; }
  $("slider").value=n; $("nInput").value=n; render();
}
$("slider").addEventListener("input",e=>setN(e.target.value));
$("nInput").addEventListener("input",e=>setN(e.target.value));
$("inc").onclick=()=>setN(cur.n+1); $("dec").onclick=()=>setN(cur.n-1);
$("start").addEventListener("change",e=>{cur.start=+e.target.value; render();});
$("target").addEventListener("change",e=>{cur.target=+e.target.value; render();});
$("scale").addEventListener("change",render);
$("maxN").addEventListener("change",e=>{ $("slider").max=e.target.value; if(cur.n>+e.target.value) setN(+e.target.value); });

// 以程式狀態為準，讓所有控制元件同步；避免瀏覽器重新整理或返回時自動回填舊值
function syncAll(){
  $("start").value=String(cur.start);
  $("target").value=String(cur.target);
  $("slider").max=$("maxN").value;
  setN(cur.n);
}
syncAll();
window.addEventListener("pageshow",syncAll);
</script>
</body>
</html>
